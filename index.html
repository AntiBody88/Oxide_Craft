<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор крафта — Oxide Survival Island</title>
<style>
  :root {
    --bg: #0f1217;
    --panel: #181d24;
    --panel-2: #1f252e;
    --border: #2a313a;
    --text: #d7dee7;
    --muted: #7d8b9c;
    --accent: #e8b84b;
    --accent-soft: rgba(232,184,75,0.12);
    --danger: #ef5b5b;
    --success: #4fd18b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f1217;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 14px 40px;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 880px; }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 {
    font-size: 1.45rem; font-weight: 800; color: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .header p { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }

  .tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 14px;
    justify-content: center;
  }
  .tab {
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { border-color: var(--muted); color: var(--text); }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1217;
  }
  .tab svg { width: 14px; height: 14px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .panel-title {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
  }

  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input {
    width: 100%;
    padding: 10px 12px 10px 36px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--muted); pointer-events: none;
  }

  /* ===== СЕТКА НА 3 КОЛОНКИ ===== */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-height: 340px;
    overflow-y: auto;
    padding: 4px;
    margin-bottom: 12px;
  }
  .items-grid::-webkit-scrollbar { width: 6px; }
  .items-grid::-webkit-scrollbar-track { background: transparent; }
  .items-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .item-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 6px;
    background: var(--panel-2);
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: all .12s;
    color: var(--text);
    user-select: none;
    text-align: center;
  }
  .item-card:hover { border-color: var(--border); background: #262e38; }
  .item-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .item-card .icon {
    width: 56px; height: 56px;
    border-radius: 9px;
    background: #141920;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .item-card .icon svg { width: 34px; height: 34px; }
  .item-card .icon img { width: 100%; height: 100%; object-fit: cover; }
  .item-card .name {
    font-size: 0.74rem;
    line-height: 1.2;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    max-width: 100%;
  }

  .empty-msg {
    grid-column: 1 / -1;
    text-align: center; color: var(--muted);
    padding: 30px; font-size: 0.85rem;
  }

  .qty-row {
    display: grid; grid-template-columns: 1fr 2fr; gap: 10px; align-items: end;
  }
  .field label {
    display: block; font-size: 0.75rem; color: var(--muted);
    margin-bottom: 5px; font-weight: 500;
  }
  .field input[type="number"] {
    width: 100%; padding: 10px 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 0.9rem;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }

  .btn {
    padding: 11px 16px;
    background: var(--accent); color: #0f1217;
    border: none; border-radius: 8px;
    font-weight: 800; font-size: 0.88rem;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #f5c95e; }

  .selected-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 14px;
  }
  .selected-item .icon {
    width: 64px; height: 64px;
    border-radius: 10px;
    background: #141920;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .selected-item .icon svg { width: 42px; height: 42px; }
  .selected-item .icon img { width: 100%; height: 100%; object-fit: cover; }
  .selected-item .name { font-weight: 700; color: var(--accent); font-size: 1rem; }
  .selected-item .cat { margin-left: auto; color: var(--muted); font-size: 0.72rem; text-align: right; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.7px; color: var(--muted); font-weight: 600;
    padding: 0 8px 8px; border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 9px 8px; border-bottom: 1px solid var(--border);
    font-size: 0.85rem; vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }

  .mat-cell { display: flex; align-items: center; gap: 10px; }
  .mat-cell .icon {
    width: 38px; height: 38px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden;
  }
  .mat-cell .icon svg { width: 24px; height: 24px; }
  .mat-cell .icon img { width: 100%; height: 100%; object-fit: cover; }

  .owned-input {
    width: 68px; padding: 5px 7px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 0.82rem;
    text-align: center; outline: none;
  }
  .owned-input:focus { border-color: var(--accent); }

  .missing { color: var(--danger); font-weight: 700; }
  .ok { color: var(--success); font-weight: 700; }
  .hint { font-size: 0.72rem; color: var(--muted); line-height: 1.5; margin-top: 10px; }

  @media (max-width: 560px) {
    .qty-row { grid-template-columns: 1fr; }
    .items-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .item-card { padding: 8px 4px; gap: 4px; }
    .item-card .icon { width: 48px; height: 48px; }
    .item-card .icon svg { width: 30px; height: 30px; }
    .item-card .name { font-size: 0.7rem; }
    thead th, tbody td { padding: 8px 4px; font-size: 0.78rem; }
    .owned-input { width: 54px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>🔨 Калькулятор крафта</h1>
    <p>Oxide Survival Island</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск по всем категориям..." oninput="renderItems()">
    </div>
    <div class="items-grid" id="itemsGrid"></div>
    <div class="qty-row">
      <div class="field">
        <label for="qtyInput">Количество</label>
        <input type="number" id="qtyInput" value="1" min="1" step="1">
      </div>
      <button class="btn" onclick="calculate()">Рассчитать материалы</button>
    </div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <div class="selected-item" id="selectedItem"></div>
    <div class="panel-title">Необходимые материалы</div>
    <table>
      <thead><tr><th>Материал</th><th>Нужно</th><th>Есть</th><th>Не хватает</th></tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
    <div class="hint">Учитываются только прямые ингредиенты. Промежуточные предметы не разбираются.</div>
  </div>

</div>

/* =========================================================
   ЛОГИКА
   ========================================================= */
let currentCategory = "buildings";
let selectedId = null;

const tabsEl = document.getElementById('tabs');
const itemsGrid = document.getElementById('itemsGrid');
const searchInput = document.getElementById('searchInput');

function getItem(id) {
  return ITEMS[id] || EXTRA_RESOURCES[id] || null;
}

function renderTabs() {
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (cat.id === currentCategory ? ' active' : '');
    tab.innerHTML = `${cat.icon}<span>${cat.name}</span>`;
    tab.onclick = () => {
      currentCategory = cat.id;
      searchInput.value = '';
      renderTabs();
      renderItems();
    };
    tabsEl.appendChild(tab);
  });
}

function getIconHTML(itemId, catName) {
  if (pngMap[itemId]) {
    const fallback = CATEGORIES.find(c => c.name === catName)?.icon || SVG.other;
    const safe = fallback.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `<img src="${pngMap[itemId]}" alt="" onerror="this.outerHTML='${safe}'">`;
  }
  const cat = CATEGORIES.find(c => c.name === catName);
  return cat?.icon || SVG.other;
}

function renderItems() {
  const query = searchInput.value.trim().toLowerCase();
  itemsGrid.innerHTML = '';
  selectedId = null;

  let ids;
  if (query) {
    ids = Object.keys(ITEMS).filter(id => ITEMS[id].name.toLowerCase().includes(query));
  } else {
    const catName = CATEGORIES.find(c => c.id === currentCategory)?.name;
    ids = Object.keys(ITEMS).filter(id => ITEMS[id].category === catName);
  }

  if (ids.length === 0) {
    itemsGrid.innerHTML = '<div class="empty-msg">' + (query ? 'Ничего не найдено' : 'В этой категории пока нет предметов') + '</div>';
    return;
  }

  ids.forEach(id => {
    const item = ITEMS[id];
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="icon">${getIconHTML(id, item.category)}</div>
      <span class="name">${item.name}</span>
    `;
    card.onclick = () => {
      document.querySelectorAll('.item-card.active').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selectedId = id;
    };
    itemsGrid.appendChild(card);
  });
}

function calculate() {
  if (!selectedId) {
    alert('Сначала выберите предмет из списка');
    return;
  }

  const item = getItem(selectedId);
  const qty = Math.max(1, parseInt(document.getElementById('qtyInput').value) || 1);
  const recipe = recipes[selectedId];

  document.getElementById('selectedItem').innerHTML = `
    <div class="icon">${getIconHTML(selectedId, item.category)}</div>
    <span class="name">${item.name}</span>
    <span class="cat">${item.category} · ×${qty}</span>
  `;

  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = '';

  if (!recipe || Object.keys(recipe).length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px;">Рецепт для «${item.name}» ещё не заполнен.</td></tr>`;
  } else {
    for (const [matId, amount] of Object.entries(recipe)) {
      const total = amount * qty;
      const mat = getItem(matId);
      const matName = mat ? mat.name : matId;
      const matCat = mat ? mat.category : null;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div class="mat-cell"><div class="icon">${getIconHTML(matId, matCat)}</div><span>${matName}</span></div></td>
        <td>${total}</td>
        <td><input type="number" class="owned-input" value="0" min="0"></td>
        <td class="missing-cell">—</td>
      `;
      tbody.appendChild(tr);
    }
    tbody.querySelectorAll('.owned-input').forEach(inp => {
      inp.addEventListener('input', updateMissing);
    });
  }

  document.getElementById('resultPanel').style.display = 'block';
  updateMissing();
}

function updateMissing() {
  document.querySelectorAll('#resultBody tr').forEach(tr => {
    const needCell = tr.cells[1];
    if (!needCell) return;
    const need = parseInt(needCell.textContent) || 0;
    const input = tr.querySelector('.owned-input');
    if (!input) return;
    const owned = parseInt(input.value) || 0;
    const cell = tr.querySelector('.missing-cell');
    const miss = Math.max(0, need - owned);
    cell.textContent = miss > 0 ? miss : '✓';
    cell.className = 'missing-cell ' + (miss > 0 ? 'missing' : 'ok');
  });
}

renderTabs();
renderItems();
